<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SanitizerPro | Pharmacy Batch Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/umd/lucide.min.js"></script>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { margin: 0; color: var(--primary); font-size: 24px; }
        .header p { color: #64748b; font-size: 14px; }

        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: var(--accent); ring: 2px var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        button {
            width: 100%;
            background: var(--accent);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .result-box {
            margin-top: 24px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
            display: none;
            border-left: 4px solid var(--accent);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .batch-tag {
            font-family: monospace;
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            display: block;
            margin-top: 12px;
        }

        .warning {
            background: #fef2f2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        @media print {
            button, .input-group, .header p { display: none !important; }
            body { padding: 0; background: white; }
            .app-container { box-shadow: none; max-width: 100%; }
            .result-box { display: block !important; background: white; border: 1px solid #ccc; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>SanitizerPro</h1>
        <p>WHO-Standard Formulation Tool</p>
    </div>

    <div id="alert" class="warning">⚠️ Alcohol below 60% is not effective.</div>

    <div class="input-group">
        <label>Alcohol Source Strength (%)</label>
        <input type="number" id="c1" value="95" placeholder="e.g. 95">
    </div>

    <div class="grid">
        <div class="input-group">
            <label>Target (%)</label>
            <input type="number" id="c2" value="75">
        </div>
        <div class="input-group">
            <label>Batch Size (L)</label>
            <input type="number" id="v2" value="5">
        </div>
    </div>

    <div class="grid">
        <div class="input-group">
            <label>Glycerol (%)</label>
            <input type="number" id="gly" value="1.45" step="0.01">
        </div>
        <div class="input-group">
            <label>H2O2 3% (%)</label>
            <input type="number" id="h2o2" value="4.17" step="0.01">
        </div>
    </div>

    <button onclick="calculate()">Calculate Batch</button>
    <button id="printBtn" style="display:none; background:#0f172a;" onclick="window.print()">Print Label</button>

    <div id="result" class="result-box">
        <h3 style="margin-top:0">Formulation Summary</h3>
        <div id="formula-list"></div>
        <span id="batchID" class="batch-tag"></span>
    </div>
</div>

<script>
    function calculate() {
        const c1 = parseFloat(document.getElementById('c1').value);
        const c2 = parseFloat(document.getElementById('c2').value);
        const v2 = parseFloat(document.getElementById('v2').value);
        const glyP = parseFloat(document.getElementById('gly').value);
        const h2oP = parseFloat(document.getElementById('h2o2').value);

        if (c2 < 60) {
            document.getElementById('alert').style.display = 'block';
        } else {
            document.getElementById('alert').style.display = 'none';
        }

        // Calculation
        const alcoholVol = (c2 * v2) / c1;
        const glyVol = (glyP / 100) * v2;
        const h2oVol = (h2oP / 100) * v2;
        const waterVol = v2 - alcoholVol - glyVol - h2oVol;

        // Display
        document.getElementById('result').style.display = 'block';
        document.getElementById('printBtn').style.display = 'block';
        
        document.getElementById('formula-list').innerHTML = `
            <div class="result-item"><span>Alcohol (${c1}%):</span> <strong>${alcoholVol.toFixed(3)} L</strong></div>
            <div class="result-item"><span>Glycerol (98%):</span> <strong>${(glyVol * 1000).toFixed(1)} ml</strong></div>
            <div class="result-item"><span>H2O2 (3%):</span> <strong>${(h2oVol * 1000).toFixed(1)} ml</strong></div>
            <div class="result-item"><span>Distilled Water:</span> <strong>${waterVol.toFixed(3)} L</strong></div>
            <div class="result-item" style="border-top:1px solid #cbd5e1; padding-top:8px; margin-top:8px">
                <span>Total Yield:</span> <strong>${v2} L</strong>
            </div>
        `;

        const date = new Date().toISOString().slice(0,10).replace(/-/g,"");
        document.getElementById('batchID').innerText = `BATCH ID: LOT-${date}-${Math.floor(Math.random()*900 + 100)}`;
    }
</script>

</body>
</html>
